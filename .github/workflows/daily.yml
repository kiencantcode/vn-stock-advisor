name: daily-update
on:
  schedule:
    # giờ VN 15:47, 17:13, 18:43, 20:23, 22:17 và 5:37, 7:07 sáng hôm sau: GitHub hay trễ hoặc bỏ lịch.
    # Lần chạy đầu thành công là đủ, các lần sau tự bỏ qua (advisor/fresh.py).
    - cron: "47 8 * * 1-5"
    - cron: "13 10 * * 1-5"
    - cron: "43 11 * * 1-5"
    - cron: "23 13 * * 1-5"
    - cron: "17 15 * * 1-5"
    - cron: "37 22 * * 1-5"
    - cron: "7 0 * * 2-6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["web/**", "GUIDE.pdf", ".github/workflows/daily.yml", "output/site.json"]   # chỉ xuất bản lại trang (kể cả khi cập nhật từ máy)
concurrency:
  group: daily-update
  cancel-in-progress: false
permissions: {}
jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: fresh
        if: github.event_name == 'schedule'
        run: python3 advisor/fresh.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.fresh.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - uses: actions/cache@v6
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - run: pip install -r requirements.txt
        if: steps.fresh.outputs.skip != 'true'
      - run: python run.py
        if: steps.fresh.outputs.skip != 'true'
      - name: Commit kết quả
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Cập nhật dự báo $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git pull --rebase
          git push
  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - run: |
          mkdir _site
          cp web/* GUIDE.pdf output/site.json output/report.html output/forecast.html _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: first
        continue-on-error: true   # gói vừa tải lên đôi khi chưa sẵn sàng
        uses: actions/deploy-pages@v5
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.second.outcome == 'failure'
        run: sleep 600   # GitHub Pages đang lỗi: thử lần cuối sau 10 phút
      - id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5
